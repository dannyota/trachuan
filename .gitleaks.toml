title = "trachuan"
[extend]
useDefault = true

[[allowlists]]
description = "Research notes"
paths = ['''docs/research/.*''']

# VBPL provision tree fixtures name every node with "key": "<uuid>"; only that
# exact shape, only in the recorded VBPL tree fixtures, is allowed.
[[allowlists]]
description = "VBPL provision node keys in recorded fixtures"
condition = "AND"
paths = ['''apps/corpus/internal/vbpl/testdata/tree-.*\.json''', '''^apps/corpus/internal/stage/extract/testdata/structure/(145780|27845|67878)-tree\.json$''', '''^apps/corpus/internal/stage/extract/testdata/heading-(5664|10761)\.json$''']
regexes = ['''key"\s*:\s*"[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}"''']
regexTarget = "match"

# Embedder recipe reports pin the model by commit ("resolved_revision",
# "tokenizer_revision", 40 hex characters) and by file hashes
# ("tokenizer_sha256", "weights_sha256", 64 hex characters); only those fields,
# only in the recipe files and the corpus manifest fixture that embeds them, are
# allowed.
[[allowlists]]
description = "Model file hashes in embedder recipes"
condition = "AND"
paths = ['''internal/embedding/recipes/.*\.json''', '''^deploy/host/updater/fixtures/corpus-manifest\.json$''']
regexes = ['''(tokenizer|weights)_sha256"\s*:\s*"[0-9a-f]{64}"''', '''(resolved|tokenizer)_revision"\s*:\s*"[0-9a-f]{40}"''']
regexTarget = "line"
