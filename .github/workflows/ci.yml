name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      schema: ${{ steps.paths.outputs.schema }}
      go: ${{ steps.paths.outputs.go }}
      docembed: ${{ steps.paths.outputs.docembed }}
      queryembed: ${{ steps.paths.outputs.queryembed }}
      web: ${{ steps.paths.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          schema=true
          go=true
          docembed=true
          queryembed=true
          web=true
          if [ "$EVENT_NAME" = pull_request ]; then
            paths=$(mktemp)
            git diff --no-ext-diff --no-textconv --no-renames --name-only -z "$BASE_SHA...$HEAD_SHA" -- > "$paths"
            schema=false
            go=false
            docembed=false
            queryembed=false
            web=false
            while IFS= read -r -d '' path; do
              case "$path" in
                packages/schema/*|apps/server/internal/accountapi/*|apps/server/internal/webapi/*|apps/server/internal/weblogin/*|apps/server/internal/websession/*|apps/server/internal/apierror/*|apps/server/internal/contracttest/*|apps/server/internal/mcpapi/*|.github/workflows/ci.yml|.tool-versions|Makefile) schema=true ;;
              esac
              case "$path" in
                apps/docembed/*|.github/workflows/*) docembed=true ;;
              esac
              case "$path" in
                apps/queryembed/*|internal/embedding/*|go.mod|go.sum|Makefile|scripts/queryembed-native.sh|.github/workflows/ci.yml) queryembed=true ;;
              esac
              case "$path" in
                apps/web/*|packages/schema/*|.tool-versions|.github/workflows/ci.yml) web=true ;;
              esac
              case "$path" in
                docs/*.md) ;;
                apps/web/*) ;;
                *.md) [[ "$path" != */* ]] || go=true ;;
                *) go=true ;;
              esac
            done < "$paths"
            rm "$paths"
          fi
          echo "schema=$schema" >> "$GITHUB_OUTPUT"
          echo "go=$go" >> "$GITHUB_OUTPUT"
          echo "docembed=$docembed" >> "$GITHUB_OUTPUT"
          echo "queryembed=$queryembed" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"

  schema:
    needs: [preflight]
    if: needs.preflight.outputs.schema == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          cache: npm
          cache-dependency-path: packages/schema/package-lock.json
      - run: npm ci
        working-directory: packages/schema
      - run: make schema-gen
      - run: git diff --exit-code
      - run: test -z "$(git status --porcelain -- packages/schema)"

  static:
    needs: [preflight]
    if: needs.preflight.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ runner.arch }}-static-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-static-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-${{ runner.arch }}-static-
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          cache: npm
      - run: npm ci
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          skip-save-cache: ${{ !((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.head_ref == 'ci-speed') }}
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: make pre-push
      - run: make test
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.head_ref == 'ci-speed'
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ runner.arch }}-static-${{ hashFiles('go.sum') }}-${{ github.sha }}

  integration:
    needs: [preflight]
    if: needs.preflight.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [integration, proof]
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: ci
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEMPORAL_CLI_CACHE: /home/runner/.cache/temporal-cli
      # The runner image ships pg_dump 16 on PATH; checkpoints need the PGDG 18 client.
      CORPUS_PG_DUMP: /usr/lib/postgresql/18/bin/pg_dump
      CORPUS_PG_RESTORE: /usr/lib/postgresql/18/bin/pg_restore
      CORPUS_TEST_ADMIN_URL: postgres://postgres:ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ runner.arch }}-integration-${{ matrix.shard }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-integration-${{ matrix.shard }}-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-${{ runner.arch }}-integration-${{ matrix.shard }}-
      - run: go mod download
      - name: Install PostgreSQL client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc > /dev/null
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y postgresql-client-18
      - name: Read Temporal SDK version
        id: temporal
        run: echo "version=$(awk '$1 == "go.temporal.io/sdk" { print $2 }' go.mod)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TEMPORAL_CLI_CACHE }}
          key: temporal-cli-${{ runner.os }}-${{ runner.arch }}-${{ steps.temporal.outputs.version }}
      - if: matrix.shard == 'integration'
        run: make test-integration
      - if: matrix.shard == 'proof'
        run: make test-proof
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.head_ref == 'ci-speed'
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ runner.arch }}-integration-${{ matrix.shard }}-${{ hashFiles('go.sum') }}-${{ github.sha }}

  e2e:
    needs: [preflight]
    if: needs.preflight.outputs.go == 'true' || needs.preflight.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: ci
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CORPUS_TEST_ADMIN_URL: postgres://postgres:ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ runner.arch }}-e2e-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-e2e-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-${{ runner.arch }}-e2e-
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      # The runner image already has Chrome's system libraries; only the browser download is needed.
      - run: npx playwright install chromium
        working-directory: apps/web
      - run: make e2e
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.head_ref == 'ci-speed'
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ runner.arch }}-e2e-${{ hashFiles('go.sum') }}-${{ github.sha }}

  web:
    needs: [preflight]
    if: needs.preflight.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      # The runner image already has Chrome's system libraries; only the browser download is needed.
      - run: npx playwright install chromium
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run e2e

  docembed:
    needs: [preflight]
    if: needs.preflight.outputs.docembed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/docembed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --frozen
      - run: uv run --frozen ruff check
      - run: uv run --frozen ruff format --check
      - run: uv run --frozen pytest

  queryembed:
    needs: [preflight]
    if: needs.preflight.outputs.queryembed == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      CGO_LDFLAGS: -L${{ github.workspace }}/work/native/linux-arm64
      QUERYEMBED_ORT_LIB: ${{ github.workspace }}/work/native/linux-arm64/libonnxruntime.so
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ runner.arch }}-queryembed-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-queryembed-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-${{ runner.arch }}-queryembed-
      # The query recipe pins the Go version; build with exactly that toolchain.
      - run: echo "GOTOOLCHAIN=go$(awk '$1 == "go" { print $2; exit }' go.mod)" >> "$GITHUB_ENV"
      - run: bash scripts/queryembed-native.sh linux-arm64
      - run: go test -race -tags ort ./apps/queryembed/...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          skip-save-cache: ${{ !((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.head_ref == 'ci-speed') }}
          args: --build-tags ort ./apps/queryembed/...
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.head_ref == 'ci-speed'
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ runner.arch }}-queryembed-${{ hashFiles('go.sum') }}-${{ github.sha }}

  ci:
    if: always()
    needs: [preflight, static, integration, e2e, docembed, queryembed, schema, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SCHEMA_NEEDED: ${{ needs.preflight.outputs.schema }}
      SCHEMA: ${{ needs.schema.result }}
      PREFLIGHT: ${{ needs.preflight.result }}
      GO: ${{ needs.preflight.outputs.go }}
      STATIC: ${{ needs.static.result }}
      INTEGRATION: ${{ needs.integration.result }}
      E2E: ${{ needs.e2e.result }}
      DOCEMBED_NEEDED: ${{ needs.preflight.outputs.docembed }}
      DOCEMBED: ${{ needs.docembed.result }}
      QUERYEMBED_NEEDED: ${{ needs.preflight.outputs.queryembed }}
      QUERYEMBED: ${{ needs.queryembed.result }}
      WEB_NEEDED: ${{ needs.preflight.outputs.web }}
      WEB: ${{ needs.web.result }}
    steps:
      - run: |
          test "$PREFLIGHT" = success
          if [ "$SCHEMA_NEEDED" = true ]; then
            test "$SCHEMA" = success
          elif [ "$SCHEMA_NEEDED" = false ]; then
            test "$SCHEMA" = skipped
          else
            exit 1
          fi
          if [ "$QUERYEMBED_NEEDED" = true ]; then
            test "$QUERYEMBED" = success
          elif [ "$QUERYEMBED_NEEDED" = false ]; then
            test "$QUERYEMBED" = skipped
          else
            exit 1
          fi
          if [ "$GO" = true ] || [ "$WEB_NEEDED" = true ]; then
            test "$E2E" = success
          elif [ "$GO" = false ] && [ "$WEB_NEEDED" = false ]; then
            test "$E2E" = skipped
          else
            exit 1
          fi
          if [ "$WEB_NEEDED" = true ]; then
            test "$WEB" = success
          elif [ "$WEB_NEEDED" = false ]; then
            test "$WEB" = skipped
          else
            exit 1
          fi
          if [ "$DOCEMBED_NEEDED" = true ]; then
            test "$DOCEMBED" = success
          elif [ "$DOCEMBED_NEEDED" = false ]; then
            test "$DOCEMBED" = skipped
          else
            exit 1
          fi
          if [ "$GO" = true ]; then
            test "$STATIC" = success && test "$INTEGRATION" = success
          elif [ "$GO" = false ]; then
            test "$STATIC" = skipped && test "$INTEGRATION" = skipped
          else
            exit 1
          fi
