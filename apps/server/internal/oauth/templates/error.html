<!doctype html>
<html lang="{{.Lang}}">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{.Title}}</title><style>{{.Style}}</style></head>
<body>
<main>
<div class="top"><span class="brand"><svg width="28" height="28" viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="52" fill="none" stroke="currentColor" stroke-width="6"/><circle cx="60" cy="60" r="40" fill="none" stroke="currentColor" stroke-width="2"/><text x="60" y="74" text-anchor="middle" font-family="NotoSerif, Georgia, serif" font-size="40" font-weight="700" fill="currentColor">TC</text></svg>Tra Chuẩn</span></div>
<h1>{{.Heading}}</h1>
<p>{{.Message}}</p>
<p class="error-code"><code>{{.Error}}</code></p>
{{if .Action}}<a class="button primary" href="{{.Action}}">{{.Return}}</a>{{end}}
</main>
</body>
</html>
