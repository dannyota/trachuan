[project]
name = "trachuan-docembed"
version = "0.1.0"
description = "Document embedding service for trachuan: PyTorch MPS (ADR 0011)."
requires-python = "==3.14.*"
dependencies = [
  "fastapi==0.162.2",
  "uvicorn==0.54.0",
  "numpy==2.5.4",
  "onnxruntime==1.31.1",
  "tokenizers==0.23.3",
  "transformers==5.22.2",
]

[dependency-groups]
document = ["torch==2.15.0"]
dev = ["pytest==9.2.0", "httpx==0.28.1", "onnx==1.23.2", "ruff==0.17.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trachuan_docembed"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
