openapi: 3.1.0
info:
  title: trachuan web API
  version: 1.0.0
  description: Session API. Unsafe methods require a matching Origin or Referer and X-CSRF-Token. JSON
    bodies are limited to 64 KiB.
security:
- session: []
paths:
  /api/v1/auth/google/start:
    get:
      tags: [weblogin]
      responses:
        '302':
          description: Redirect
          headers:
            Location:
              schema: &id001
                type: string
            Set-Cookie:
              schema: *id001
          content:
            text/html:
              schema:
                type: string
        '429':
          description: Request failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              schema:
                type: integer
        '503':
          description: Request failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
      parameters:
      - name: next
        in: query
        required: false
        schema: *id001
  /api/v1/auth/google/callback:
    get:
      tags: [weblogin]
      responses:
        '302':
          description: Redirect
