components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-session
    login:
      type: apiKey
      in: cookie
      name: __Host-login
    pending:
      type: apiKey
      in: cookie
      name: __Host-pending
  schemas:
    LoginDestination:
      type: object
      additionalProperties: false
      required: [next]
      properties:
        next:
          type: string
    FactorRequired:
      type: object
      additionalProperties: false
      required: [factor_required, csrf]
      properties:
        factor_required:
          type: boolean
          enum: [true]
        csrf:
          type: string
    PendingFactor:
      type: object
      additionalProperties: false
      required: [csrf, next]
      properties:
        csrf:
          type: string
        next:
          type: string
    FactorCode:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
    FactorInput:
      oneOf:
      - $ref: '#/components/schemas/FactorCode'
      - type: object
        additionalProperties: false
        required: [recovery_code]
        properties:
          recovery_code:
            type: string
    TOTPSetup:
      type: object
      additionalProperties: false
      required: [otpauth_uri, secret]
      properties:
        otpauth_uri:
          type: string
        secret:
          type: string
    RecoveryCodes:
      type: object
      additionalProperties: false
      required: [recovery_codes]
      properties:
        recovery_codes:
          type: array
          items:
            type: string
    TOTPConfirmation:
      oneOf:
      - $ref: '#/components/schemas/Empty'
      - $ref: '#/components/schemas/RecoveryCodes'
    Empty:
      type: object
      additionalProperties: false
    EmailRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          description: Parsed as an ASCII addr-spec. Syntactically invalid strings receive the same 202 with no mail.
    LinkRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
    LinkCompletion:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token:
          type: string
        password:
          type: string
    RegistrationCompletion:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token:
          type: string
        password:
          type: string
        next:
          description: Ignored.
    PasswordChange:
      oneOf:
      - type: object
        additionalProperties: false
        required: [token, password]
        properties:
          token:
            type: string
          password:
            type: string
          code:
            type: string
      - type: object
        additionalProperties: false
        required: [current, password]
        properties:
          current:
            type: string
          password:
            type: string
          code:
            type: string
    EmailLink:
      type: object
      additionalProperties: false
      required: [purpose, email]
      properties:
        purpose:
          type: string
          enum: [registration, reset, add_password]
        email:
          type: string
    ReportInput:
      type: object
      additionalProperties: false
      required: [country, kind]
      properties:
        country:
          type: string
          enum: [vn]
        kind:
          $ref: '#/components/schemas/ReportKind'
        handle:
          type: string
          minLength: 1
          maxLength: 512
        release:
          type: string
        suggestion:
          type: object
          properties:
            status_class:
              type: string
              enum: [in_force, partial, expired, not_yet, suspended, unknown]
            eff_from:
              type: string
              format: date
            eff_to:
              type: string
              format: date
            document_number:
              type: string
              minLength: 1
              maxLength: 128
            issue_date:
              type: string
              format: date
      allOf:
      - if:
          properties:
            kind:
              const: wrong_text
        then:
          required: [handle]
          properties:
            suggestion:
              type: object
              additionalProperties: false
      - if:
          properties:
            kind:
              const: wrong_validity
        then:
          required: [handle]
          properties:
            suggestion:
              type: object
              additionalProperties: false
              properties:
                status_class:
                  type: string
                  enum: [in_force, partial, expired, not_yet, suspended, unknown]
                eff_from:
                  type: string
                  format: date
                eff_to:
                  type: string
                  format: date
      - if:
          properties:
            kind:
              const: broken_citation
        then:
          required: [handle]
          properties:
            suggestion:
              type: object
              additionalProperties: false
              properties:
                document_number:
                  type: string
                  minLength: 1
                  maxLength: 128
      - if:
          properties:
            kind:
              const: missing_document
        then:
          required: [suggestion]
          properties:
            suggestion:
              type: object
              additionalProperties: false
              required: [document_number]
              properties:
                document_number:
                  type: string
                  minLength: 1
                  maxLength: 128
                issue_date:
                  type: string
                  format: date
    ReportKind:
      type: string
      enum: [wrong_text, wrong_validity, broken_citation, missing_document]
    ReportResult:
      type: object
      additionalProperties: false
      required: [report_id, state, deduplicated]
      properties:
        report_id:
          type: integer
          format: int64
        state:
          type: string
          enum: [open]
        deduplicated:
          type: boolean
    ReportList:
      type: object
      additionalProperties: false
      required: [reports]
      properties:
        reports:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Report'
        next:
          type: string
    Report:
      type: object
      additionalProperties: false
      required: [report_id, kind, document_key, anchor, document_number, target, suggestion, state, created_at, changed_at]
      properties:
        report_id:
          type: integer
          format: int64
        kind:
          $ref: '#/components/schemas/ReportKind'
        document_key:
          type: string
        anchor:
          type: string
        document_number:
          type: string
        target:
          type: string
        suggestion:
          type: object
          additionalProperties: false
          properties:
            status_class:
              type: string
              enum: [in_force, partial, expired, not_yet, suspended, unknown]
            eff_from:
              type: string
              format: date
            eff_to:
              type: string
              format: date
            document_number:
              type: string
            issue_date:
              type: string
              format: date
        state:
          type: string
          enum: [open, accepted, rejected, withdrawn]
        created_at:
          type: string
          format: date-time
        changed_at:
          type: string
          format: date-time
    Error:
      type: object
      properties:
        factor:
          type: boolean
        error:
          type: object
          properties:
            code:
              type: string
              enum:
              - invalid_request
              - invalid_handle
              - cursor_expired
              - unauthenticated
              - reauth_required
              - reauth_failed
              - login_failed
              - factor_failed
              - link_invalid
              - password_rejected
              - csrf_rejected
              - account_blocked
              - not_found
              - release_expired
              - body_too_large
              - unsupported_media_type
              - token_limit
              - rate_limited
              - busy
              - unavailable
              - inference_failed
              - internal
            message: *id001
          required:
          - code
          - message
      required:
      - error
    Account:
      type: object
      properties:
        id: &id003
          type: integer
          format: int64
        email: *id001
        created_at: &id004
          type: string
          format: date-time
        password:
