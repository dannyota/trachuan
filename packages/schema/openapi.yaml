openapi: 3.1.0
info:
  title: trachuan web API
  version: 1.0.0
  description: Session API. Unsafe methods require a matching Origin or Referer and X-CSRF-Token. JSON
    bodies are limited to 64 KiB.
security:
- session: []
paths:
  /api/v1/auth/google/start:
    get:
      responses:
        '302':
          description: Redirect
          headers:
            Location:
              schema: &id001
                type: string
            Set-Cookie:
              schema: *id001
          content:
            text/html:
              schema:
                type: string
        '429':
          description: Request failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              schema:
                type: integer
        '503':
          description: Request failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
      parameters:
      - name: next
        in: query
        required: false
        schema: *id001
  /api/v1/auth/google/callback:
    get:
      responses:
        '302':
          description: Redirect
          headers:
            Location:
              schema: *id001
            Set-Cookie:
              schema: *id001
          content:
            text/html:
              schema:
                type: string
        '429':
          description: Request failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              schema:
                type: integer
        '503':
          description: Request failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - login: []
      parameters:
      - name: state
        in: query
        required: false
        schema: *id001
      - name: code
        in: query
        required: false
        schema: *id001
      - name: error
        in: query
        required: false
        schema: *id001
  /api/v1/auth/logout:
    post:
      responses:
        '204':
          description: Success
        '401':
          description: Request failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Request failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Request failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              schema:
                type: integer
        '503':
          description: Request failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      - name: Origin
        in: header
        required: false
        description: Required unless Referer supplies the same origin.
        schema:
          type: string
      - name: Referer
        in: header
        required: false
        description: Used when Origin is absent.
        schema:
          type: string
  /api/v1/me:
    get:
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          description: Request failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Request failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              schema:
                type: integer
        '503':
          description: Request failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      responses:
        '204':
          description: Success
        '401':
          description: Request failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Request failed
          content:
            application/json:
              schema:
