openapi: 3.1.0
info:
  title: trachuan web API
  version: 1.0.0
  description: Session API. Unsafe methods require a matching Origin or Referer and X-CSRF-Token. JSON
    bodies are limited to 64 KiB.
security:
- session: []
paths:
  /api/v1/auth/google/start:
    get:
      tags: [weblogin]
      responses:
        '302':
          description: Redirect
          headers:
            Location:
              schema: &id001
                type: string
            Set-Cookie:
              schema: *id001
          content:
            text/html:
              schema:
                type: string
        '429':
          description: Request failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              schema:
                type: integer
        '503':
          description: Request failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
      parameters:
      - name: next
        in: query
        required: false
        schema: *id001
  /api/v1/auth/google/callback:
    get:
      tags: [weblogin]
      responses:
        '302':
          description: Redirect
          headers:
            Location:
              schema: *id001
            Set-Cookie:
              schema: *id001
          content:
            text/html:
              schema:
                type: string
        '429':
          description: Request failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              schema:
                type: integer
        '503':
          description: Request failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - login: []
      parameters:
      - name: state
        in: query
        required: false
        schema: *id001
      - name: code
        in: query
        required: false
        schema: *id001
      - name: error
        in: query
        required: false
        schema: *id001
  /api/v1/auth/logout:
    post:
      tags: [websession]
      responses:
        '204':
          description: Success
        '401':
          description: Request failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Request failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Request failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              schema:
                type: integer
        '503':
          description: Request failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      - name: Origin
        in: header
        required: false
        description: Required unless Referer supplies the same origin.
        schema:
          type: string
      - name: Referer
        in: header
        required: false
        description: Used when Origin is absent.
        schema:
          type: string
  /api/v1/auth/password:
    post:
      tags: [password]
      security: []
      parameters:
      - name: Origin
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email:
                  type: string
                next:
                  type: string
                  description: A same-origin path validated before and after percent decoding; defaults to /.
                password:
                  type: string
      responses:
        '200':
          description: Session created, or pending factor authentication created for five minutes.
          headers:
            Set-Cookie:
              description: Sets the session cookie, or __Host-pending with Secure, HttpOnly, SameSite=Strict, Path=/ and Max-Age=300.
              schema:
                type: string
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/LoginDestination'
                - $ref: '#/components/schemas/FactorRequired'
        '400':
          description: Invalid JSON request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: login_failed for every credential or email-counter refusal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: CSRF rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Body exceeds 64 KiB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: JSON content type required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Per-IP login bucket exhausted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              schema:
                type: integer
        '503':
          description: busy when hashing admission is full or times out; unavailable on service failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/me/reauth:
    post:
      tags: [password]
      parameters:
      - name: Origin
        in: header
        required: false
        schema:
          type: string
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      - name: Referer
        in: header
        required: false
        description: Used when Origin is absent.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password:
                  type: string
      responses:
        '204':
          description: Primary proof refreshed on this session.
        '400':
          description: Invalid JSON request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: reauth_failed or unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: CSRF rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Body exceeds 64 KiB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: busy when hashing admission is full or times out; unavailable on service failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/signup:
    post:
      tags: [account-password]
      security: []
      parameters:
      - name: Origin
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '202':
          description: Uniform response for every email string; mail admission is silent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empty'
        '400':
          description: invalid_request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: csrf_rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Body exceeds 64 KiB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: JSON content type required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: rate_limited; no change committed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              schema:
                type: integer
        '503':
          description: unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/reset:
    post:
      tags: [account-password]
      security: []
      parameters:
      - name: Origin
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '202':
          description: Uniform response for every email string; mail admission is silent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empty'
        '400':
          description: invalid_request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: csrf_rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Body exceeds 64 KiB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: JSON content type required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: rate_limited; no change committed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              schema:
                type: integer
        '503':
          description: unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/link:
    post:
      tags: [account-password]
      security: []
      parameters:
      - name: Origin
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkRequest'
      responses:
        '200':
          description: Live link metadata. Reads only; the token stays in the JSON body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailLink'
        '400':
          description: invalid_request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: csrf_rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: link_invalid for an unknown, expired, consumed or mismatched link.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Body exceeds 64 KiB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: JSON content type required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: rate_limited; no change committed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              schema:
                type: integer
        '503':
          description: unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/signup/complete:
    post:
      tags: [account-password]
      security: []
      parameters:
      - name: Origin
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationCompletion'
      responses:
        '200':
          description: Account and session created; next is ignored.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empty'
        '400':
          description: invalid_request or password_rejected before link claim.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: csrf_rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: link_invalid for an unknown, expired, consumed or mismatched link.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Body exceeds 64 KiB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: JSON content type required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: rate_limited; no change committed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              schema:
                type: integer
        '503':
          description: busy or unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/reset/complete:
    post:
      tags: [account-password]
      security: []
      parameters:
      - name: Origin
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkCompletion'
      responses:
        '204':
          description: Password reset and all credentials revoked; no session issued.
        '400':
          description: invalid_request or password_rejected before link claim.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: csrf_rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: link_invalid for an unknown, expired, consumed or mismatched link.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Body exceeds 64 KiB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: JSON content type required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: rate_limited; no change committed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              schema:
                type: integer
        '503':
          description: busy or unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/me/password/link:
    post:
      tags: [account-password]
      parameters:
      - name: Origin
        in: header
        schema:
          type: string
      - name: Referer
        in: header
        schema:
          type: string
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      responses:
        '202':
          description: Add-password mail requested after recent primary proof.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empty'
        '400':
          description: invalid_request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: csrf_rejected or reauth_required for missing recent primary proof.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/me/password:
    post:
      tags: [account-password]
      parameters:
      - name: Origin
        in: header
        schema:
          type: string
      - name: Referer
        in: header
        schema:
          type: string
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
      responses:
        '200':
          description: Password set or changed; one replacement session issued. Enrolled accounts require recent factor proof or a code.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empty'
        '400':
          description: invalid_request or password_rejected before link claim.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: unauthenticated, reauth_failed or factor_failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: csrf_rejected or reauth_required; factor true requires factor verification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: link_invalid for an unknown, expired, consumed or mismatched link.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Body exceeds 64 KiB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: rate_limited; TOTP failures persist in the locked request transaction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              schema:
                type: integer
        '503':
          description: busy or unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/factor:
    get:
      tags: [factor]
      security:
      - pending: []
      responses:
        '200':
          description: Pending CSRF token and validated destination; reads only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingFactor'
        '401':
          description: factor_failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [factor]
      security:
      - pending: []
      parameters:
      - name: Origin
        in: header
        required: true
        schema:
          type: string
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FactorInput'
      responses:
        '200':
          description: Pending authentication consumed; session issued with primary and factor proof times.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginDestination'
        '400':
          description: invalid_request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: factor_failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: csrf_rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Body exceeds 64 KiB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: JSON content type required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: rate_limited; failed attempts persist and recovery codes ignore TOTP cooldown.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/me/totp/setup:
    post:
      tags: [factor]
      parameters:
      - name: Origin
        in: header
        schema:
          type: string
      - name: Referer
        in: header
        schema:
          type: string
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: New enrollment supersedes earlier enrollment; secret returned once.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TOTPSetup'
        '401':
          description: unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: csrf_rejected or reauth_required; factor true means recent factor proof is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: not_found while SERVER_TOTP_ENROLLMENT is off.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/me/totp/confirm:
    post:
      tags: [factor]
      parameters:
      - name: Origin
        in: header
        schema:
          type: string
      - name: Referer
        in: header
        schema:
          type: string
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FactorCode'
      responses:
        '200':
          description: TOTP installed; epoch bumped and replacement session issued. First enrollment returns recovery codes once.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TOTPConfirmation'
        '400':
          description: invalid_request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: factor_failed or unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: csrf_rejected or reauth_required; factor true means recent factor proof is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: not_found while SERVER_TOTP_ENROLLMENT is off.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Body exceeds 64 KiB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: rate_limited; daily security-change allowance exhausted.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/me/totp:
    delete:
      tags: [factor]
      parameters:
      - name: Origin
        in: header
        schema:
          type: string
      - name: Referer
        in: header
        schema:
          type: string
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FactorInput'
      responses:
        '200':
          description: TOTP and recovery codes removed; epoch bumped and replacement session issued.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empty'
        '400':
          description: invalid_request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: factor_failed or unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: csrf_rejected or reauth_required; factor true means recent factor proof is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Body exceeds 64 KiB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: rate_limited; failed attempts persist and recovery codes ignore TOTP cooldown.
          headers:
            Retry-After:
              schema:
