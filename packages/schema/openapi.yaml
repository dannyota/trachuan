          description: Request failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Request failed
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Request failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/status:
    get:
      tags: [web]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorpusStatus'
        '401':
          description: Request failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Request failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              schema:
                type: integer
        '503':
          description: Request failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Request failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409': *id002
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-session
    login:
      type: apiKey
      in: cookie
      name: __Host-login
  schemas:
    ReportInput:
      type: object
      additionalProperties: false
      required: [country, kind]
      properties:
        country:
          type: string
          enum: [vn]
        kind:
          $ref: '#/components/schemas/ReportKind'
        handle:
          type: string
          minLength: 1
          maxLength: 512
        release:
          type: string
        suggestion:
          type: object
          properties:
            status_class:
              type: string
              enum: [in_force, partial, expired, not_yet, suspended, unknown]
            eff_from:
              type: string
              format: date
            eff_to:
              type: string
              format: date
            document_number:
              type: string
              minLength: 1
              maxLength: 128
            issue_date:
              type: string
              format: date
      allOf:
      - if:
          properties:
            kind:
              const: wrong_text
        then:
          required: [handle]
          properties:
            suggestion:
              type: object
              additionalProperties: false
      - if:
          properties:
            kind:
              const: wrong_validity
        then:
          required: [handle]
          properties:
            suggestion:
              type: object
              additionalProperties: false
              properties:
                status_class:
                  type: string
                  enum: [in_force, partial, expired, not_yet, suspended, unknown]
                eff_from:
                  type: string
                  format: date
                eff_to:
                  type: string
                  format: date
      - if:
          properties:
            kind:
              const: broken_citation
        then:
          required: [handle]
          properties:
            suggestion:
              type: object
              additionalProperties: false
              properties:
                document_number:
                  type: string
                  minLength: 1
                  maxLength: 128
      - if:
          properties:
            kind:
              const: missing_document
        then:
          required: [suggestion]
          properties:
            suggestion:
              type: object
              additionalProperties: false
              required: [document_number]
              properties:
                document_number:
                  type: string
                  minLength: 1
                  maxLength: 128
                issue_date:
                  type: string
                  format: date
    ReportKind:
      type: string
      enum: [wrong_text, wrong_validity, broken_citation, missing_document]
    ReportResult:
      type: object
      additionalProperties: false
      required: [report_id, state, deduplicated]
      properties:
        report_id:
          type: integer
          format: int64
        state:
          type: string
          enum: [open]
        deduplicated:
          type: boolean
    ReportList:
      type: object
      additionalProperties: false
      required: [reports]
      properties:
        reports:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Report'
        next:
          type: string
    Report:
      type: object
      additionalProperties: false
      required: [report_id, kind, document_key, anchor, document_number, target, suggestion, state, created_at, changed_at]
      properties:
        report_id:
          type: integer
          format: int64
        kind:
          $ref: '#/components/schemas/ReportKind'
        document_key:
          type: string
        anchor:
          type: string
        document_number:
          type: string
        target:
          type: string
        suggestion:
          type: object
          additionalProperties: false
          properties:
            status_class:
              type: string
              enum: [in_force, partial, expired, not_yet, suspended, unknown]
            eff_from:
              type: string
              format: date
            eff_to:
              type: string
              format: date
            document_number:
              type: string
            issue_date:
              type: string
              format: date
        state:
          type: string
          enum: [open, accepted, rejected, withdrawn]
        created_at:
          type: string
          format: date-time
        changed_at:
          type: string
          format: date-time
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
              - invalid_request
              - unauthenticated
              - reauth_required
              - csrf_rejected
              - account_blocked
              - not_found
              - release_expired
              - body_too_large
              - unsupported_media_type
              - token_limit
              - rate_limited
              - busy
              - unavailable
              - inference_failed
              - internal
            message: *id001
          required:
          - code
          - message
      required:
      - error
    Account:
      type: object
      properties:
        id: &id003
          type: integer
          format: int64
        email: *id001
        created_at: &id004
          type: string
          format: date-time
        csrf_token: *id001
      required:
      - id
      - email
      - created_at
      - csrf_token
    Session:
      type: object
      properties:
        id: *id003
        created_at: *id004
        last_seen_at: *id004
        current: &id007
          type: boolean
      required:
      - id
      - created_at
      - last_seen_at
      - current
    Token:
      type: object
      properties:
        id: *id003
        name: *id001
        created_at: *id004
        expires_at: *id004
        last_used_at: &id005
          type:
          - string
          - 'null'
          format: date-time
        revoked_at: &id006
          type:
          - string
          - 'null'
          format: date-time
      required:
      - id
      - name
      - created_at
      - expires_at
      - last_used_at
      - revoked_at
    Grant:
      type: object
      properties:
        id: *id003
        client_name: *id001
        client_id_host:
          type: string
          description: HTTPS client ID hostname, or empty for other client IDs.
        created_at: *id004
        last_used_at: *id004
      required:
      - id
      - client_name
      - client_id_host
      - created_at
      - last_used_at
    GrantList:
      type: array
      maxItems: 100
      items:
        $ref: '#/components/schemas/Grant'
    CreatedToken:
      type: object
      properties:
        id: *id003
        name: *id001
        created_at: *id004
        expires_at: *id004
        last_used_at: *id005
        revoked_at: *id006
        token: *id001
      required:
      - id
      - name
      - created_at
      - expires_at
      - last_used_at
      - revoked_at
      - token
    TokenInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        days:
          type: [integer, 'null']
          minimum: 1
          maximum: 365
          description: Defaults to 90 days when omitted or null.
      required:
      - name
      additionalProperties: false
    SessionList:
      type: array
      items:
        $ref: '#/components/schemas/Session'
    TokenList:
      type: array
      items:
        $ref: '#/components/schemas/Token'
    StatusStamp:
      type: object
      properties:
        class: *id001
        basis: *id001
        status_basis: *id001
        current: *id007
      required:
      - current
    Pointer:
      type: object
      properties:
        dir: *id001
        kind: *id001
        key: *id001
        number: *id001
        in_release: *id007
      required:
      - in_release
    Warning:
      type: object
      properties:
        dir: *id001
        kind: *id001
        key: *id001
        number: *id001
        in_release: *id007
        source: *id001
        basis: *id001
        target: *id001
        citation: *id001
        exact: *id007
        named: *id001
      required:
      - in_release
      - basis
      - target
      - citation
      - exact
    ListedRelation:
      type: object
      properties:
        dir: *id001
        kind: *id001
        key: *id001
        number: *id001
        in_release: *id007
        raw_label: *id001
        evidence: *id001
        evidence_complete: *id007
      required:
      - in_release
      - evidence_complete
    Document:
      type: object
      properties:
        nodes:
          type: array
          items: {type: string}
        number: *id001
        title: *id001
        type: *id001
        issuer: *id001
        issued: &id008
          type: string
          format: date
        effective_from: *id008
        effective_to: *id008
        status:
          $ref: '#/components/schemas/StatusStamp'
        text_source:
          type: string
          enum: [source_tree, html_transcription, ocr, none]
        text_complete: *id007
        source_url: *id001
        source_withdrawn:
          type: object
          properties:
            since: *id008
            acquired_by_rel:
              type: string
          required: [since, acquired_by_rel]
        related:
          type: array
          items:
            $ref: '#/components/schemas/Pointer'
        related_counts:
          type: object
          additionalProperties: *id003
      required:
      - status
      - text_source
      - text_complete
    Gap:
      type: object
      properties:
        kind: *id001
        document_key: *id001
        anchor: *id001
        message: *id001
    PathNode:
      type: object
      properties:
        label: *id001
        heading: *id001
        anchor: *id001
    Identity:
      type: object
      properties:
        country: *id001
        document_key: *id001
        anchor: *id001
    Fragment:
      type: object
      properties:
        identity:
          $ref: '#/components/schemas/Identity'
        start: *id003
        end: *id003
        text_start: *id003
        text_end: *id003
        role: *id001
        complete: *id007
      required:
      - start
      - end
      - text_start
      - text_end
      - complete
    Relation:
      type: object
      properties:
        source_key: *id001
        target_key: *id001
        source_number: *id001
        target_number: *id001
        source_anchor: *id001
        target_anchor: *id001
        kind: *id001
        raw_label: *id001
        evidence: *id001
        evidence_sha256: *id001
        method: *id001
        complete: *id007
        source_resolved: *id007
        target_resolved: *id007
      required:
      - complete
      - source_resolved
      - target_resolved
    NodeRef:
      type: object
      properties:
        name: {type: string}
        level: {type: integer, format: int64}
    NodeIndex:
      type: object
      additionalProperties:
        $ref: '#/components/schemas/NodeRef'
    NodeEntry:
      type: object
      properties:
        code: {type: string}
        name: {type: string}
        description: {type: string}
        level: {type: integer, format: int64}
        origin: {type: string}
        provisions: {type: integer, format: int64}
        documents: {type: integer, format: int64}
        children:
          type: array
          items:
            $ref: '#/components/schemas/NodeEntry'
    TaxonomyResult:
      type: object
      properties:
        release: {type: string}
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/NodeEntry'
        truncated: {type: boolean}
      required: [truncated]
    NodeDocument:
      type: object
      properties:
        key: {type: string}
        number: {type: string}
        title: {type: string}
        type: {type: string}
        status_class: {type: string}
        is_current: {type: boolean}
        provisions: {type: integer, format: int64}
      required: [is_current]
    NodePage:
      type: object
      properties:
        release: {type: string}
        node:
          $ref: '#/components/schemas/NodeEntry'
        path:
          type: array
          items:
            $ref: '#/components/schemas/NodeEntry'
        documents:
          type: array
          items:
            $ref: '#/components/schemas/NodeDocument'
    Facet:
      type: object
      properties:
        value: {type: string}
        count: {type: integer, format: int64}
      required: [count]
    Hit:
      type: object
      properties:
        in_filter: {type: boolean}
        nodes:
          type: array
          items: {type: string}
        handle: *id001
        doc: *id001
        citation: *id001
        locator: *id001
        path:
          type: array
          items:
            $ref: '#/components/schemas/PathNode'
        snippet: *id001
        complete: *id007
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/Warning'
        warnings_omitted: *id003
        gaps:
          type: array
          items:
            $ref: '#/components/schemas/Gap'
        text: *id001
        fragments:
          type: array
          items:
            $ref: '#/components/schemas/Fragment'
        score:
          type: number
        relations:
          type: array
          items:
            $ref: '#/components/schemas/Relation'
        next: *id001
      required:
      - complete
    SearchResult:
      type: object
      properties:
        outside_filter_count: {type: integer, format: int64}
        next_cursor: {type: string}
        nodes:
          $ref: '#/components/schemas/NodeIndex'
        release: *id001
        abstain: *id007
        reason: *id001
        message: *id001
        documents:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Document'
        hits:
          type: array
          items:
            $ref: '#/components/schemas/Hit'
        non_current:
          type: array
          items:
            $ref: '#/components/schemas/Hit'
        gaps:
          type: array
          items:
            $ref: '#/components/schemas/Gap'
      required:
      - abstain
    SearchInput:
      type: object
      properties:
        country:
          type: string
          enum: [vn]
        query: *id001
        as_of: *id008
        in_force_only: *id007
        detail:
          type: string
          enum:
          - compact
          - full
        limit:
          type: integer
          minimum: 1
          maximum: 50
        release: *id001
        nodes:
          type: array
          maxItems: 20
          description: Ordering preference that never hides hits.
          items: {type: string}
        doc_types:
          type: array
          maxItems: 10
          description: Ordering preference that never hides hits.
          items: {type: string}
        issuers:
          type: array
          maxItems: 10
          description: Ordering preference that never hides hits.
          items: {type: string}
        documents:
          type: array
          maxItems: 20
          description: Ordering preference that never hides hits.
          items: {type: string}
        cursor:
          type: string
          description: At most 2048 UTF-8 bytes.
          maxLength: 2048
      required:
      - country
      - query
      additionalProperties: false
    ReadItem:
      type: object
      properties:
        handle: *id001
        number: *id001
        from: *id001
        to: *id001
        relations: *id007
        next: *id001
      additionalProperties: false
    ReadInput:
      type: object
      properties:
        country:
          type: string
          enum: [vn]
        release: *id001
        items:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/ReadItem'
      required:
      - country
      - items
      additionalProperties: false
    Unit:
      type: object
      properties:
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/Warning'
        warnings_omitted: *id003
        kind: *id001
        anchor: *id001
        locator: *id001
        citation: *id001
        label: *id001
        heading: *id001
        text: *id001
        size: *id003
        relation:
          $ref: '#/components/schemas/ListedRelation'
        part: *id003
        parts: *id003
    ItemResult:
      type: object
      properties:
        doc: *id001
        document:
          $ref: '#/components/schemas/Document'
        units:
          type: array
          items:
            $ref: '#/components/schemas/Unit'
        complete: *id007
        next: *id001
        not_read: *id001
        error: *id001
        gaps:
          type: array
          items:
            $ref: '#/components/schemas/Gap'
      required:
      - complete
    DocumentPage:
      type: object
      properties:
        nodes:
          $ref: '#/components/schemas/NodeIndex'
        release:
          type: string
        fetch_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        item:
          $ref: '#/components/schemas/ItemResult'
      required:
      - release
      - item
      additionalProperties: false
    ReadResult:
      type: object
      properties:
        nodes:
          $ref: '#/components/schemas/NodeIndex'
        release: *id001
        items:
          type: array
          items:
            $ref: '#/components/schemas/ItemResult'
      required:
      - release
    CorpusStatus:
      type: object
      properties:
        doc_types:
          type: array
          items:
            $ref: '#/components/schemas/Facet'
        issuers:
          type: array
          items:
            $ref: '#/components/schemas/Facet'
        release: *id001
        documents: *id003
        provisions: *id003
        nodes: *id003
        gaps:
          type: object
          additionalProperties: *id003
        newest_source_date: *id008
      required:
      - release
      - documents
      - provisions
      - nodes
