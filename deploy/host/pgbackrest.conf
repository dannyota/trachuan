[global]
repo1-type=s3
repo1-s3-endpoint=axj58m4cpgbr.compat.objectstorage.ap-singapore-1.oraclecloud.com
repo1-s3-region=ap-singapore-1
repo1-s3-bucket=trachuan-backups
repo1-s3-uri-style=path
repo1-s3-key-type=shared
repo1-path=/pgbackrest/trachuan
repo1-cipher-type=none
repo1-retention-full-type=time
repo1-retention-full=30
compress-type=zst
archive-async=y
spool-path=/srv/trachuan/data/pgbackrest
process-max=2
start-fast=y
repo1-storage-verify-tls=y
log-level-file=off
log-level-console=warn

[trachuan]
pg1-path=/var/lib/postgresql/18/docker
pg1-socket-path=/var/run/postgresql
pg1-user=postgres
